# Uncomment to enable the encoder
# CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# Uncomment to enable the display
# CONFIG_ZMK_DISPLAY=y

# Enable OLED Display
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_BUILT_IN=n
CONFIG_ZMK_DISPLAY_INVERT=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y
CONFIG_NICE_OLED_ON=y

# Pick ONE animation to enable (Delete or comment out the other)
CONFIG_NICE_OLED_WIDGET_WPM_BONGO_CAT=y



CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y
